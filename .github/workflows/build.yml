name: 🎮 Diablo SMP Plugin Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 👈 ADD THIS

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 🔨 Build with Maven
        run: mvn clean package

      - name: 📦 Extract JAR information
        id: jar_info
        run: |
          JAR_FILE=$(find target -name "DiabloSmpPlugin*.jar" | head -1)
          echo "jar_name=$(basename "$JAR_FILE")" >> $GITHUB_OUTPUT
          echo "jar_size=$(du -h "$JAR_FILE" | cut -f1)" >> $GITHUB_OUTPUT
          echo "jar_path=$JAR_FILE" >> $GITHUB_OUTPUT

      - name: 📝 Generate Build Summary
        run: |
          echo "## 🎯 Diablo SMP Plugin – Build Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| **Property** | **Value** |" >> $GITHUB_STEP_SUMMARY
          echo "|--------------|-----------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Java** | 21 (Temurin) |" >> $GITHUB_STEP_SUMMARY
          echo "| **JAR file** | \`${{ steps.jar_info.outputs.jar_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **File size** | ${{ steps.jar_info.outputs.jar_size }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | ✅ **Success** |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 Download" >> $GITHUB_STEP_SUMMARY
          echo "The JAR file is attached below as a workflow artifact." >> $GITHUB_STEP_SUMMARY

      - name: ⬆️ Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiabloSmpPlugin-${{ github.run_number }}
          path: target/DiabloSmpPlugin*.jar
          if-no-files-found: error

      - name: 🚀 Create GitHub Release (on main branch push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: "Diablo SMP Plugin – Build ${{ github.run_number }}"
          body: |
            ## 🎮 Diablo SMP Plugin
            - **Commit:** `${{ github.sha }}`
            - **Build date:** ${{ github.event.head_commit.timestamp }}
            - **JAR size:** ${{ steps.jar_info.outputs.jar_size }}
          files: target/DiabloSmpPlugin*.jar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
