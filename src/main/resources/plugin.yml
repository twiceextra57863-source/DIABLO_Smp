name: DiabloSmpPlugin
version: 1.0.0
main: com.diablosmp.DiabloSmpPlugin
api-version: 1.21
author: YourName
description: Epic abilities plugin with 3-stage powers, soul exchange, and boss pack.
commands:
  diablo:
    description: Admin commands for Diablo abilities
    usage: /diablo give <player> <ability> [stage]
    permission: diablo.admin
  trust:
    description: Trust a player to receive your ability book on death
    usage: /trust <player>
    permission: diablo.trust
permissions:
  diablo.admin:
    default: op
  diablo.trust:
    default: true
  diablo.ability.*:
    default: false
    children:
      diablo.ability.soulweaver: true
  diablo.ability.soulweaver:
    default: false
