name: ${project.artifactId}
version: ${project.version}
main: com.diablosmp.DiabloSmpPlugin
api-version: '1.21'
description: ᗩᗷYᔕᔕᗩᒪ ᑭOᗯEᖇᔕ ᖴOᖇ ᗪIᗩᗷᒪO ᔕᗰᑭ
author: Minetwice

commands:
  abyssal:
    description: §5⬡ §dᑕOᗰᗰᗩᑎᗪ TᕼE ᗩᗷYᔕᔕᗩᒪ ᑭOᗯEᖇᔕ §5⬡
    usage: /abyssal <bestow|cleanse|compendium|awakening>
    aliases: [abyss, aby]
  soulbind:
    description: §5⬡ §dᗷIᑎᗪ YOᑌᖇ ᔕOᑌᒪ TO ᗩᑎOTᕼEᖇ §5⬡
    usage: /soulbind <player>
    aliases: [bind, sb]
    
permissions:
  abyssal.*:
    description: ᗩᒪᒪ ᗩᗷYᔕᔕᗩᒪ ᑭEᖇᗰIᔕᔕIOᑎᔕ
    children:
      abyssal.archon: true
      abyssal.awakened: true
  abyssal.archon:
    description: ᗩᖇᑕᕼOᑎ ᑕOᗰᗰᗩᑎᗪᔕ
    default: op
  abyssal.awakened:
    description: ᑌᔕE ᗩᗷYᔕᔕᗩᒪ ᑭOᗯEᖇᔕ
    default: true
