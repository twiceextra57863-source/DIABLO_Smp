name: DiabloSmpPlugin
version: 1.0.0
main: com.diablosmp.DiabloSmpPlugin
api-version: '1.21'
description: Diablo SMP Plugin with Epic Abilities
author: DarkLord
website: https://github.com/yourname/DiabloSmpPlugin

commands:
  diablo:
    description: Main Diablo SMP command
    usage: /diablo <give|remove|list|reload>
    aliases: [ds, dsmp]
  ability:
    description: Manage player abilities
    usage: /ability <give|remove|list> <player> <ability>
    aliases: [ab]
  trust:
    description: Trust another player to share abilities
    usage: /trust <player>
    aliases: [tr]
    
permissions:
  diablosmp.admin:
    description: Admin commands access for Diablo SMP
    default: op
  diablosmp.use:
    description: Use Diablo SMP abilities
    default: true
